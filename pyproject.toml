[project]
name = "corporate-agent-skills"
version = "0.1.0"
description = "Validation tooling for the corporate Agent Skills catalog."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.codespell]
skip = ".git,.venv,uv.lock,.github/skills,.specify/scripts"

[dependency-groups]
dev = [
    "codespell==2.4.3",
    "mdformat==1.0.0",
    "pre-commit==4.7.0",
    "ruff==0.17.2",
]
